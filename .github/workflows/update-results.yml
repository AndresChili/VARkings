name: Update Match Results

# El Mundial 2026 terminó y la app ya no está en mantenimiento activo:
# se quita el "schedule" y el workflow queda solo para ejecución manual.
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger update-results cron
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/update-results")
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Cron endpoint returned $STATUS"
          fi
